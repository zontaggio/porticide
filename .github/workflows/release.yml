name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: swift test

      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/bundle-app.sh --universal

      - name: Package
        run: ditto -c -k --keepParent build/Porticide.app "build/Porticide-${GITHUB_REF_NAME}.zip"

      - name: Extract release notes
        run: |
          # The CHANGELOG section for this version, without its heading.
          awk -v version="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/Porticide-${GITHUB_REF_NAME}.zip" \
            --title "Porticide ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
